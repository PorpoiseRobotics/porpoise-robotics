sentence=Two-way ESP-NOW networking shared by the Find the Target game and the security camera system.
paragraph=Header-only ESP-NOW mesh for ESP32. Broadcast-first so no MAC addresses need copying between boards, with a duplicate filter, hop-limited relaying for range, acknowledgements for events that matter, and a live roster of every node on the network. Works on Arduino-ESP32 core 2.x and 3.x.
